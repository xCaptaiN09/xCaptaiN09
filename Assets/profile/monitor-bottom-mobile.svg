<svg xmlns="http://www.w3.org/2000/svg" width="420" height="314" viewBox="0 0 420 314" role="img" aria-labelledby="title">
<title id="title">Samsung / Intel Core 5 120U / Arch Linux / Hyprland / Caelestia / Kitty / Zed / Python / C / C++ / Shell. Student by day. Maintainer by night.</title>
<defs>
